<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Melo</title>
    <link rel="shortcut icon" href="src/assets/image/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/style/reset.css">
    <link rel="stylesheet" href="src/style/style.css">
</head>

<body>

        <div class="logo-container">
            <img src="src/assets/image/logo.svg" alt="logo-img">

        </div>
        <nav>
